[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myvoc"
version = "0.1.0"
description = "CLI word memory trainer with Ebbinghaus review"
requires-python = ">=3.8"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "appdirs>=1.4.4",
]

[project.optional-dependencies]
audio = ["playsound>=1.2.2"]

[project.scripts]
myvoc = "myvoc.cli:cli"

[tool.setuptools.packages.find]
include = ["myvoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
