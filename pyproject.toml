[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "myvoc"
version = "0.1.0"
description = "CLI word memory trainer with Ebbinghaus review"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "appdirs>=1.4.4",
    "playsound2>=1.3",
]

[project.scripts]
myvoc = "myvoc.cli:cli"

[tool.setuptools.packages.find]
include = ["myvoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
